name: env-demo

on: push

env:
  APP_NAME: journey

jobs:
  env-build:
    runs-on: ubuntu-latest

    env:
      LOG_LEVEL: info

    steps:
      - name: app-name-1
        run: |
          echo "APP_NAME=$APP_NAME"
          echo "LOG_LEVEL=$LOG_LEVEL"

      - name: app-name-2
        env:
          LOG_LEVEL: debug
        run: |
          echo "APP_NAME=$APP_NAME"
          echo "LOG_LEVEL=$LOG_LEVEL" 
